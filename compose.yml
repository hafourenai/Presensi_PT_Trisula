services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=30"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presensi}
      POSTGRES_USER: ${POSTGRES_USER:-presensi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presensi_local_secret}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/local_schema.sql:/docker-entrypoint-initdb.d/01-local-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-presensi} -d $${POSTGRES_DB:-presensi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: presensi-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BODY_SIZE_LIMIT: 10M
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-presensi}:${POSTGRES_PASSWORD:-presensi_local_secret}@postgres:5432/${POSTGRES_DB:-presensi}}
      AUTH_CACHE_TTL_MS: ${AUTH_CACHE_TTL_MS:-30000}
      LOCAL_DB_CACHE_TTL_MS: ${LOCAL_DB_CACHE_TTL_MS:-10000}
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{headers:{'x-forwarded-host':'127.0.0.1','x-forwarded-proto':'http'}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web

  admin-tools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: presensi-admin-tools:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-presensi}:${POSTGRES_PASSWORD:-presensi_local_secret}@postgres:5432/${POSTGRES_DB:-presensi}}
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - caddy
      
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      EMPLOYEE_DOMAIN: ${EMPLOYEE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
