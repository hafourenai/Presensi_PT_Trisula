<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Screen — Presensi Kamera & GPS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 flex justify-center">
  <div class="w-full max-w-xl space-y-6">
    <!-- Header Widget & Live Clock -->
    <div class="rounded-3xl bg-gradient-to-br from-emerald-600 via-emerald-700 to-teal-800 p-6 text-white shadow-xl shadow-emerald-700/20 sm:p-8">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-emerald-100">Presensi Hari Ini (WIB)</p>
          <p class="mt-1 text-sm text-emerald-100/90 font-medium">Rabu, 7 Oktober 2026</p>
        </div>
        <div class="flex items-center gap-2 rounded-2xl bg-white/10 px-4 py-2 backdrop-blur-md">
          <span class="font-mono text-2xl font-bold tracking-tight text-white">07:54:12</span>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-4 border-t border-white/15 pt-4 text-xs text-emerald-50">
        <div><span class="opacity-75">Jam Masuk:</span> <strong class="ml-1 font-semibold">08:00 WIB</strong></div>
        <div><span class="opacity-75">Jam Pulang:</span> <strong class="ml-1 font-semibold">16:00 WIB</strong></div>
        <div><span class="opacity-75">Toleransi:</span> <strong class="ml-1 font-semibold">0 Menit</strong></div>
      </div>
    </div>

    <!-- Status Cards -->
    <div class="grid grid-cols-2 gap-4">
      <div class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-xs">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Presensi Masuk</span>
        <p class="mt-2 text-lg font-bold text-slate-900">--:--</p>
        <span class="mt-1 inline-block rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-medium text-slate-500">Belum Masuk</span>
      </div>

      <div class="rounded-2xl border border-slate-200/80 bg-white p-4 shadow-xs">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Presensi Pulang</span>
        <p class="mt-2 text-lg font-bold text-slate-900">--:--</p>
        <span class="mt-1 inline-block rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-medium text-slate-500">Belum Pulang</span>
      </div>
    </div>

    <!-- Camera Simulation Screen -->
    <div class="rounded-3xl border border-slate-200/80 bg-white p-6 shadow-sm">
      <div class="relative overflow-hidden rounded-2xl bg-slate-900 h-80 flex flex-col justify-between p-4">
        <!-- Detection Indicator -->
        <div class="flex justify-end">
          <div class="flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-semibold bg-emerald-500/90 text-white shadow-lg">
            <span class="h-2 w-2 rounded-full bg-white animate-ping"></span>
            <span>Wajah Terdeteksi (Siap)</span>
          </div>
        </div>

        <!-- Oval Guide -->
        <div class="mx-auto h-48 w-36 rounded-[50%] border-2 border-dashed border-emerald-400"></div>

        <div class="text-center">
          <p class="text-xs font-medium text-white/90">Posisikan wajah tepat di dalam bingkai</p>
        </div>
      </div>

      <div class="mt-4 flex gap-3">
        <button class="flex-1 rounded-xl border border-slate-200 py-3 text-xs font-semibold text-slate-700">
          Batal
        </button>
        <button class="flex-1 rounded-xl bg-emerald-600 py-3 text-xs font-semibold text-white shadow-lg shadow-emerald-600/25">
          Ambil Foto Selfie
        </button>
      </div>
    </div>
  </div>
</body>
</html>
