<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Screen — Halaman Masuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-center items-center p-6 relative overflow-hidden">
  <!-- Glow Orbs -->
  <div class="absolute -top-40 -right-40 h-96 w-96 rounded-full bg-emerald-100/60 blur-3xl"></div>
  <div class="absolute -bottom-40 -left-40 h-96 w-96 rounded-full bg-teal-100/60 blur-3xl"></div>

  <div class="relative w-full max-w-md">
    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-600/20 text-2xl font-bold">
        🏢
      </div>
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
        Presensi Karyawan
      </h1>
      <p class="mt-2 text-xs text-slate-600">
        Sistem Presensi GPS & Deteksi Wajah Internal Perusahaan
      </p>
    </div>

    <!-- Login Card -->
    <div class="rounded-3xl border border-slate-200/80 bg-white/90 p-8 shadow-xl shadow-slate-200/50 backdrop-blur-xl sm:p-10">
      <form class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
            NIP / Username / Email
          </label>
          <input
            type="text"
            placeholder="Masukkan NIP atau Email"
            class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3.5 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white"
          />
          <p class="mt-1 text-[11px] text-slate-400">Gunakan NIP/Username yang diberikan oleh Admin HR.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700">
            Kata Sandi
          </label>
          <input
            type="password"
            placeholder="Masukkan kata sandi"
            class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3.5 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white"
          />
        </div>

        <div class="pt-2">
          <button
            type="button"
            class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 px-5 py-3.5 text-xs font-semibold text-white shadow-lg shadow-emerald-600/25"
          >
            <span>Masuk ke Akun</span>
          </button>
        </div>
      </form>

      <div class="mt-8 border-t border-slate-100 pt-6 text-center text-xs text-slate-500">
        <p>Belum memiliki akun? Hubungi Administrator atau HR untuk pendaftaran akun karyawan.</p>
      </div>
    </div>
  </div>
</body>
</html>
