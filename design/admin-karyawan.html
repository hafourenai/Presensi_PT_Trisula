<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Screen — Kelola Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-8 space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Daftar Karyawan</h1>
      <p class="text-xs text-slate-500">Kelola akun dan kredensial presensi karyawan</p>
    </div>
    <div class="flex gap-2">
      <button class="px-3.5 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl text-xs font-semibold">Impor Massal</button>
      <button class="px-3.5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Tambah Karyawan</button>
    </div>
  </div>

  <div class="p-6 bg-white rounded-3xl border border-slate-200">
    <table class="w-full text-left text-xs">
      <thead class="border-b border-slate-100 text-slate-400">
        <tr>
          <th class="pb-3 uppercase">Karyawan</th>
          <th class="pb-3 uppercase">Departemen</th>
          <th class="pb-3 uppercase">Role</th>
          <th class="pb-3 uppercase">Status</th>
          <th class="pb-3 text-right uppercase">Aksi</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <tr>
          <td class="py-3.5">
            <p class="font-bold text-slate-900">Budi Santoso</p>
            <p class="text-[11px] text-slate-400">KRY002 · budi@perusahaan.com</p>
          </td>
          <td class="py-3.5">Teknologi Informasi</td>
          <td class="py-3.5"><span class="px-2 py-0.5 bg-slate-100 rounded-full font-bold text-[10px]">karyawan</span></td>
          <td class="py-3.5 text-emerald-600 font-semibold">Aktif</td>
          <td class="py-3.5 text-right"><button class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-lg">Detail</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
